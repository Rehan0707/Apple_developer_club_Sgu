<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Admin Login - Apple Developer Club SGU" />
  <title>Admin Login — Apple Developer Club SGU</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .signin-page { min-height: 100dvh; display: flex; flex-direction: column; background: #f5f5f7; }
    .signin-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px 60px; }
    .signin-wrap  { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }

    .signin-card { background: #ffffff; border-radius: 28px; padding: 48px 44px 40px; width: 100%; box-shadow: 0 2px 6px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.09); text-align: center; position: relative; overflow: hidden; }
    .signin-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg,#0071e3,#5e5ce6,#bf5af2,#ff375f,#ff9f0a); }
    
    .signin-heading { font-size: 28px; font-weight: 700; letter-spacing: -.6px; color: #1d1d1f; margin: 0 0 8px; line-height: 1.15; }
    .signin-sub { font-size: 15px; line-height: 1.5; color: #6e6e73; margin: 0 auto 24px; max-width: 320px; display: block; }

    .input-group { margin-bottom: 18px; text-align: left; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: #1d1d1f; margin-bottom: 7px; }
    .input-group input { width: 100%; padding: 12px 16px; font-size: 15px; border: 1px solid rgba(0,0,0,0.15); border-radius: 12px; background: #f5f5f7; color: #1d1d1f; outline: none; transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box; }
    .input-group input:focus { border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,0.2); background: #ffffff; }

    .submit-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; padding: 14px 20px; background: #0071e3; color: #fff; border: none; border-radius: 13px; font-size: 16px; font-weight: 600; letter-spacing: -.2px; cursor: pointer; text-decoration: none; font-family: inherit; transition: background .18s, transform .15s, box-shadow .18s; box-shadow: 0 4px 14px rgba(0,113,227,.24); }
    .submit-btn:hover { background: #0062c4; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,113,227,.32); }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled { opacity: .65; cursor: wait; transform: none; }

    .error-message { color: #ff3b30; font-size: 13px; margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: #fff2f2; border: 1px solid #ffd4d4; display: none; text-align: left; }

    .dev-hint-card { display: none; margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: #f0f7ff; border: 1px solid #cce5ff; text-align: left; font-size: 12px; color: #0056b3; line-height: 1.5; }
    .dev-hint-card strong { display: block; font-size: 13px; margin-bottom: 4px; color: #004085; }
    .dev-fill-btn { margin-top: 8px; padding: 6px 12px; background: #0071e3; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .dev-fill-btn:hover { background: #005bb5; }

    .portal-switch { margin-top: 22px; font-size: 13px; color: #6e6e73; line-height: 1.5; }
    .portal-switch a { color: #0071e3; text-decoration: none; font-weight: 500; }
    .portal-switch a:hover { text-decoration: underline; }
  </style>
</head>
<body class="signin-page">
  <main id="main" class="signin-main">
    <div class="signin-wrap">
      <div class="signin-card">
        <h1 class="signin-heading">Admin Portal</h1>
        <span class="signin-sub">Sign in with club lead credentials to manage events, badges, and members.</span>

        <div class="error-message" id="error-msg" role="alert"></div>

        <form id="admin-login-form">
          <div class="input-group">
            <label for="username">Admin Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. rehan@lead" required autocomplete="username">
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">
            <span>Sign In</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <div class="dev-hint-card" id="devHint">
          <strong>⚡ Local Development Credentials</strong>
          <div>Username: <code>rehan@lead</code></div>
          <div>Password: <code>Rehan123</code></div>
          <button type="button" class="dev-fill-btn" id="devFillBtn">Autofill Credentials</button>
        </div>

        <div class="portal-switch">
          Looking for student access?<br>
          <a href="/join/">Go to Student Member Sign In & Registration →</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    // If running on loopback, show dev hint helper
    if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
      const devHint = document.getElementById('devHint');
      if (devHint) devHint.style.display = 'block';
    }

    document.getElementById('devFillBtn')?.addEventListener('click', () => {
      document.getElementById('username').value = 'rehan@lead';
      document.getElementById('password').value = 'Rehan123';
    });

    // Check if already authenticated as admin
    (async () => {
      try {
        const res = await fetch('/api/auth/status', { credentials: 'same-origin' });
        if (res.ok) {
          const auth = await res.json();
          if (auth.authenticated && auth.role === 'admin') {
            window.location.replace('/admin/index.html');
          }
        }
      } catch {}
    })();

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = document.getElementById('submitBtn');
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      button.disabled = true;
      button.innerHTML = '<span>Signing in…</span>';
      errorMsg.style.display = 'none';

      try {
        const response = await fetch('/api/auth/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 429) {
            errorMsg.textContent = 'Too many attempts. Please wait before trying again.';
          } else if (response.status === 503) {
            errorMsg.textContent = 'Admin sign-in is not configured on this server.';
          } else {
            errorMsg.textContent = result.error || 'Incorrect username or password.';
          }
          errorMsg.style.display = 'block';
          button.disabled = false;
          button.innerHTML = '<span>Sign In</span> <span aria-hidden="true">→</span>';
          return;
        }

        window.location.href = '/admin/index.html';
      } catch (err) {
        errorMsg.textContent = 'Sign-in could not be completed. Please check server connectivity.';
        errorMsg.style.display = 'block';
        button.disabled = false;
        button.innerHTML = '<span>Sign In</span> <span aria-hidden="true">→</span>';
      }
    });
  </script>
</body>
</html>

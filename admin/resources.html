        <span class="material-symbols-outlined text-[20px]">developer_mode_tv</span>

      </a></nav>
      </div>
    </div>
  </aside><div class="pl-64"><header class="fixed top-0 left-64 right-0 h-16 bg-surface-container-lowest/80 backdrop-blur-xl z-40 flex items-center justify-end px-space-lg border-b border-outline-variant">

      <div class="flex flex-col text-right hidden sm:flex">
        <span class="font-body-md text-body-md font-semibold text-on-surface leading-snug">Alex Chen</span>
        <span class="font-caption-sm text-caption-sm text-primary font-medium">Club Co-Lead</span>
      </div>
      <img alt="Profile" class="w-8 h-8 rounded-full object-cover ring-2 ring-primary/20 shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1U9DjIG6D2JHKmYO0vJz4WLCVJpokrToe03XgNPfDA4DkUzhwk2E-vDSRJUzYS1YX0-ZnZjNBbO9rUsFv_Ss0PFjz0EecP8IpQHR7e6KBgN1otrF42lpHo-vaCwCxzczT6SPzdpiDaPu5G_8gNcEtzX3Tvtsf6L3UqXSifwJXEnlGPQEODVPl8IhsQnEMeZlpmEqdu8R8cdqZwYURv-oO6fI7WnoCkDcjie-RyPoEHpF-on5T8l_COYI5I"/>
    </div>
  </div>
</header>

<main class="w-full pt-16 bg-background min-h-screen relative pb-space-xl">
  <div class="p-space-lg lg:p-margin flex flex-col gap-space-xl max-w-7xl mx-auto">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-space-md">
      <div>
        <h1 class="font-headline-xl text-headline-xl text-on-surface font-bold">Resources Hub</h1>
        <p class="font-body-md text-on-surface-variant mt-1">Manage learning materials, slides, and links for students.</p>
      </div>
      <div class="flex gap-space-sm">
        <button onclick="document.getElementById('addResourceModal').showModal()" class="flex items-center gap-space-xs h-10 px-space-md bg-primary hover:bg-[#0062c4] text-white rounded-lg font-title-md transition-all active:scale-95 shadow-sm">
          <span class="material-symbols-outlined text-[18px]">add</span>
          <span>Add Resource</span>
        </button>
      </div>
    </div>

    <!-- Resources Table -->
    <div class="bg-white rounded-xl border border-outline-variant shadow-sm overflow-hidden flex flex-col">
      <div class="p-space-md border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest">
        <h2 class="font-title-md font-semibold text-on-surface">Available Resources</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-surface-container border-b border-outline-variant text-on-surface-variant font-caption-sm uppercase tracking-wider">
              <th class="p-space-md font-semibold">Title</th>
              <th class="p-space-md font-semibold">Category</th>
              <th class="p-space-md font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="resourcesTableBody" class="divide-y divide-outline-variant/60">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ADD RESOURCE MODAL -->
  <dialog id="addResourceModal" class="bg-white rounded-2xl shadow-2xl p-0 w-[90%] max-w-md backdrop:bg-black/40 backdrop:backdrop-blur-sm border border-outline-variant open:animate-in open:fade-in open:zoom-in-95">
    <form method="dialog" class="flex flex-col" onsubmit="handleResourceSubmit(event)">
      <div class="p-space-lg border-b border-outline-variant flex items-center justify-between">
        <h2 class="font-headline-lg font-bold" id="resourceModalTitle">Add Resource</h2>
        <button type="button" onclick="document.getElementById('addResourceModal').close()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container text-on-surface-variant transition-colors">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>
      <div class="p-space-lg flex flex-col gap-space-md">
        <input type="hidden" id="resId">
        <div class="flex flex-col gap-1.5">
          <label class="font-caption-sm font-semibold text-on-surface-variant uppercase tracking-wider">Resource Title</label>
          <input type="text" id="resTitle" class="border border-outline-variant rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all text-body-md" placeholder="e.g. Human Interface Guidelines" required>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="font-caption-sm font-semibold text-on-surface-variant uppercase tracking-wider">Category</label>
          <select id="resCategory" class="border border-outline-variant rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all text-body-md bg-white">
            <option value="Swift UI">Swift UI</option>
            <option value="Core SDK">Core SDK</option>
            <option value="Design">Design</option>
            <option value="Career">Career</option>
            <option value="General">General</option>
          </select>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="font-caption-sm font-semibold text-on-surface-variant uppercase tracking-wider">URL Link</label>
          <input type="url" id="resUrl" class="border border-outline-variant rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all text-body-md" placeholder="https://..." required>
        </div>
      </div>
      <div class="p-space-md bg-surface-container-lowest border-t border-outline-variant flex justify-end gap-space-sm rounded-b-2xl">
        <button type="button" onclick="document.getElementById('addResourceModal').close()" class="px-space-md py-2 font-medium text-on-surface hover:bg-surface-container rounded-lg transition-colors">Cancel</button>
        <button type="submit" class="px-space-md py-2 font-semibold text-white bg-primary hover:bg-[#0062c4] rounded-lg transition-colors shadow-sm">Save Resource</button>
      </div>
    </form>
  </dialog>

  <script>
    let allResources = [];

    async function loadResources() {
      try {
        const res = await fetch('/api/resources');
        allResources = await res.json();
        renderResources();
      } catch (e) {
        console.error('Failed to load resources', e);
      }
    }

    function renderResources() {
      const tbody = document.getElementById('resourcesTableBody');
      tbody.innerHTML = '';
      if (allResources.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-space-md text-center text-on-surface-variant">No resources added yet.</td></tr>';
        return;
      }
      
      allResources.forEach(res => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-surface-container-lowest/50 transition-colors';
        tr.innerHTML = `
          <td class="p-space-md">
            <a href="${res.url}" target="_blank" class="font-medium text-primary hover:underline flex items-center gap-1">
              ${res.title}
              <span class="material-symbols-outlined text-[14px]">open_in_new</span>
            </a>
          </td>
          <td class="p-space-md text-on-surface-variant text-sm">${res.category || 'General'}</td>
          <td class="p-space-md text-right">
            <button class="text-primary hover:underline font-caption-sm font-semibold mr-3" onclick="editResource('${res.id}')">Edit</button>
            <button class="text-error hover:underline font-caption-sm font-semibold" onclick="deleteResource('${res.id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function editResource(id) {
      const res = allResources.find(r => r.id === id);
      if (!res) return;
      document.getElementById('resId').value = res.id;
      document.getElementById('resTitle').value = res.title;
      document.getElementById('resUrl').value = res.url;
      document.getElementById('resCategory').value = res.category || 'General';
      document.getElementById('resourceModalTitle').innerText = 'Edit Resource';
      document.getElementById('addResourceModal').showModal();
    }

    async function deleteResource(id) {
      if (!confirm('Are you sure you want to delete this resource?')) return;
      const res = await fetch(`/api/admin/resources/${id}`, { method: 'DELETE' });
      if (res.ok) {
        allResources = allResources.filter(r => r.id !== id);
        renderResources();
      }
    }

    async function handleResourceSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('resId').value;
      const data = {
        title: document.getElementById('resTitle').value,
        url: document.getElementById('resUrl').value,
        category: document.getElementById('resCategory').value
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `/api/admin/resources/${id}` : '/api/admin/resources';
      
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      if (res.ok) {
        document.getElementById('addResourceModal').close();
        document.getElementById('resId').value = '';
        e.target.reset();
        document.getElementById('resourceModalTitle').innerText = 'Add Resource';
        loadResources(); // refresh
      }
    }

    loadResources();
  </script>
</main>

</div></body></html>

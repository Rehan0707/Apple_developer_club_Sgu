<html class="light" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><meta content="web_dashboard" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><link rel="stylesheet" href="/src/generated/admin--resources.css"><link rel="stylesheet" href="/src/portal.css"><title>Resources Hub — Apple Developer Club SGU</title><link href="/favicon.svg" rel="icon"></head><body class="bg-background text-on-surface font-body-md text-body-md antialiased selection:bg-primary selection:text-white"><aside class="fixed left-0 top-0 h-full w-64 bg-surface-container-lowest border-r border-outline-variant z-50 flex flex-col justify-between p-4">
    <div class="flex flex-col gap-6">
      <a href="/" class="flex items-center justify-center py-2 px-1 transition-opacity hover:opacity-80">
        <img alt="Apple Developer Club SGU" class="w-full object-contain" src="/images/club-lockup.webp">
      </a>
      <div class="flex flex-col gap-1">
        <span class="px-2 font-semibold text-[11px] text-[#86868b] tracking-wider uppercase mb-1">Navigation</span>
        <nav class="flex flex-col gap-1"><a class="flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors font-medium" href="/admin/index.html">
        <span class="material-symbols-outlined text-[20px]">calendar_month</span>
        <span class="text-sm">Events</span>
      </a><a class="flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors font-medium" href="/admin/registrations.html">
        <span class="material-symbols-outlined text-[20px]">how_to_reg</span>
        <span class="text-sm">Registrations</span>
      </a><a class="flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors font-medium" href="/admin/badges.html">
        <span class="material-symbols-outlined text-[20px]">verified</span>
        <span class="text-sm">Badges</span>
      </a><a aria-current="page" class="flex items-center gap-3 px-3 py-2 rounded-lg transition-colors bg-primary/10 text-primary font-semibold" href="/admin/resources.html">
        <span class="material-symbols-outlined text-[20px]">developer_mode_tv</span>
        <span class="text-sm">Resources</span>
      </a></nav>
      </div>
    </div>
  </aside><div class="pl-64"><header class="fixed top-0 left-64 right-0 h-16 bg-surface-container-lowest/80 backdrop-blur-xl z-40 flex items-center justify-end px-space-lg border-b border-outline-variant">
  <div class="flex items-center gap-space-md">
    <div class="flex items-center gap-space-sm pl-space-xs border-outline-variant">
      <div class="flex flex-col text-right hidden sm:flex">
        <span class="font-body-md text-body-md font-semibold text-on-surface leading-snug">Administrator</span>
        <span class="font-caption-sm text-caption-sm text-primary font-medium">Club Co-Lead</span>
      </div>
      <img alt="Apple Developer Club SGU" class="w-24 h-8 object-contain" src="/images/club-lockup.webp">
    </div>
  </div>
</header>

<main class="w-full pt-16 bg-background min-h-screen relative pb-space-xl">
  <div class="p-space-lg lg:p-margin flex flex-col gap-space-xl max-w-7xl mx-auto">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-space-md">
      <div>
        <h1 class="font-headline-xl text-headline-xl text-on-surface font-bold">Resources Hub</h1>
        <p class="font-body-md text-on-surface-variant mt-1">Manage learning materials, slides, and links for students.</p>
      </div>
      <div class="flex gap-space-sm">
        <button onclick="document.getElementById('addResourceModal').showModal()" class="flex items-center gap-space-xs h-10 px-space-md bg-primary hover:bg-[#0062c4] text-white rounded-lg font-title-md transition-all active:scale-95 shadow-sm">
          <span class="material-symbols-outlined text-[18px]">add</span>
          <span>Add Resource</span>
        </button>
      </div>
    </div>

    <!-- Resources Table -->
    <div class="bg-white rounded-xl border border-outline-variant shadow-sm overflow-hidden flex flex-col">
      <div class="p-space-md border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest">
        <h2 class="font-title-md font-semibold text-on-surface">Available Resources</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-surface-container border-b border-outline-variant text-on-surface-variant font-caption-sm uppercase tracking-wider">
              <th class="p-space-md font-semibold">Title</th>
              <th class="p-space-md font-semibold">Category</th>
              <th class="p-space-md font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="resourcesTableBody" class="divide-y divide-outline-variant/60">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ADD RESOURCE MODAL -->
  <dialog id="addResourceModal" class="bg-white rounded-2xl shadow-2xl p-0 w-[90%] max-w-md backdrop:bg-black/40 backdrop:backdrop-blur-sm border border-outline-variant open:animate-in open:fade-in open:zoom-in-95">
    <form method="dialog" class="flex flex-col" onsubmit="handleResourceSubmit(event)">
      <div class="p-space-lg border-b border-outline-variant flex items-center justify-between">
        <h2 class="font-headline-lg font-bold" id="resourceModalTitle">Add Resource</h2>
        <button aria-label="Close dialog" type="button" onclick="document.getElementById('addResourceModal').close()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container text-on-surface-variant transition-colors">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>
      <div class="p-space-lg flex flex-col gap-space-md">
        <input type="hidden" id="resId">
        <div class="flex flex-col gap-1.5">
          <label for="resTitle" class="font-caption-sm font-semibold text-on-surface-variant uppercase tracking-wider">Resource Title</label>
          <input type="text" id="resTitle" class="border border-outline-variant rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all text-body-md" placeholder="e.g. Human Interface Guidelines" required>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="resCategory" class="font-caption-sm font-semibold text-on-surface-variant uppercase tracking-wider">Category</label>
          <select id="resCategory" class="border border-outline-variant rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all text-body-md bg-white">
            <option value="Swift UI">Swift UI</option>
            <option value="Core SDK">Core SDK</option>
            <option value="Developer Tools">Developer Tools</option>
            <option value="Design">Design</option>
            <option value="App Store">App Store</option>
            <option value="Career">Career</option>
            <option value="General">General</option>
          </select>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="resUrl" class="font-caption-sm font-semibold text-on-surface-variant uppercase tracking-wider">URL Link</label>
          <input type="url" id="resUrl" class="border border-outline-variant rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all text-body-md" placeholder="https://..." required>
        </div>
        <div class="flex flex-col gap-1.5"><label for="resDesc" class="font-caption-sm font-semibold text-on-surface-variant uppercase tracking-wider">Description</label><textarea id="resDesc" rows="3" class="border border-outline-variant rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all text-body-md resize-none" placeholder="What is this resource for?"></textarea></div>
      </div>
      <div class="p-space-md bg-surface-container-lowest border-t border-outline-variant flex justify-end gap-space-sm rounded-b-2xl">
        <button type="button" onclick="document.getElementById('addResourceModal').close()" class="px-space-md py-2 font-medium text-on-surface hover:bg-surface-container rounded-lg transition-colors">Cancel</button>
        <button type="submit" class="px-space-md py-2 font-semibold text-white bg-primary hover:bg-[#0062c4] rounded-lg transition-colors shadow-sm">Save Resource</button>
      </div>
    </form>
  </dialog>


</main>

</div><script type="module" src="/src/admin.js"></script></body></html>

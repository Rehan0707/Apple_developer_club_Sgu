<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Team - Apple Developer Club SGU" />
  <title>Team — Apple Developer Club SGU</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .page-header {
      padding: 120px 20px 60px;
      text-align: center;
      background: #f5f5f7;
    }
    .page-title {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1.2px;
      color: #1d1d1f;
      margin: 0 0 16px;
    }
    .page-desc {
      font-size: 21px;
      line-height: 1.4;
      color: #86868b;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      padding: 80px 20px;
      max-width: 1060px;
      margin: 0 auto;
    }
    
    .team-member {
      text-align: center;
    }
    .team-section { max-width: 1060px; margin: 0 auto; padding: 72px 20px 96px; }
    .team-section h2 { font-size: 32px; letter-spacing: -0.6px; margin: 0; color: #1d1d1f; }
    .team-section > p { color: #6e6e73; margin: 12px 0 0; }
    .team-section .team-grid { padding: 40px 0 0; }
    .team-member { background: #fff; border: 1px solid #e5e5ea; border-radius: 20px; padding: 40px 28px; box-shadow: 0 4px 24px rgba(0,0,0,.04); }
    .member-photo-placeholder { display: inline-grid !important; place-items: center; color: #0071e3; font-size: 50px; background: #f5f5f7 !important; }
    
    .member-photo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      background: #e5e5ea;
      display: inline-block;
    }
    
    .member-name {
      font-size: 24px;
      font-weight: 600;
      color: #1d1d1f;
      margin: 0 0 8px;
      letter-spacing: -0.5px;
    }
    
    .member-role {
      font-size: 17px;
      font-weight: 500;
      color: #0071e3;
      margin: 0 0 12px;
    }
    
    .member-bio {
      font-size: 15px;
      line-height: 1.5;
      color: #6e6e73;
    }
  </style>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="nav-inner local-inner">
      <a class="brand" href="/"><img src="/images/club-lockup.png" alt="Apple Developer Club SGU" class="brand-logo" width="180" height="60" /></a>
      <nav id="navigation">
        <a href="/">The Club</a>
        <a href="/events/">Events</a>
        <a href="/guide/">Club Guide</a>
        <a href="/resources/">Resources</a>
        <a href="/team/" aria-current="page">Team</a>
        <a class="button small" href="/join/">Sign In</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <header class="page-header">
      <h1 class="page-title">Meet the Team</h1>
      <p class="page-desc">The club leaders dedicated to bringing the best of Apple platforms to SGU.</p>
    </header>

    <section class="team-section" aria-labelledby="core-team-heading"><h2 id="core-team-heading">Core Team</h2><p>These roles will be updated with confirmed club member profiles.</p><div class="team-grid" id="team-container"><!-- Generated via JS --></div></section>
  </main>

  <script type="module" src="/src/public-data.js"></script>
</body>
</html>

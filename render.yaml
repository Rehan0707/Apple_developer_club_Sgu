services:
  - type: web
    name: apple-developer-club-sgu
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: club-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOCAL_PREVIEW
        value: 'false'
      - key: SEED_PUBLIC_RESOURCES
        value: 'true'
      - key: DATABASE_PATH
        value: /var/data/club.sqlite
      - key: UPLOADS_PATH
        value: /var/data/uploads
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: adc-sgu-portal-2026
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Resources - Apple Developer Club SGU" />
  <title>Resources — Apple Developer Club SGU</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .page-header {
      padding: 120px 20px 60px;
      text-align: center;
      background: #f5f5f7;
    }
    .page-title {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1.2px;
      color: #1d1d1f;
      margin: 0 0 16px;
    }
    .page-desc {
      font-size: 21px;
      line-height: 1.4;
      color: #86868b;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .resources-sections { max-width: 1060px; margin: 0 auto; padding: 64px 20px 96px; display: flex; flex-direction: column; gap: 64px; }
    .resource-section-title { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; color: #1d1d1f; margin: 0 0 24px; }
    .resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }
    
    .resource-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: left;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      border: 1px solid #e5e5ea;
    }
    .resource-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.1);
    }
    .resource-card-video { padding: 0; overflow: hidden; }
    .resource-thumbnail { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #1d1d1f; }
    .resource-thumbnail img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
    .resource-card-video:hover .resource-thumbnail img { transform: scale(1.035); }
    .resource-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.72); color: #fff; display: grid; place-items: center; font-size: 20px; padding-left: 3px; box-shadow: 0 6px 20px #0005; }
    .resource-card-content { padding: 32px; display: flex; flex-direction: column; flex: 1; }
    .resource-source { color: #6e6e73; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .resource-card-video .resource-title { font-size: 22px; }
    @media (max-width: 700px) { .resource-card-content { padding: 24px; } }
    
    .resource-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
      color: #0071e3;
    }
    
    .resource-title {
      font-size: 24px;
      font-weight: 600;
      color: #1d1d1f;
      margin: 0 0 12px;
      letter-spacing: -0.5px;
    }
    
    .resource-desc {
      font-size: 17px;
      line-height: 1.5;
      color: #6e6e73;
      margin: 0 0 24px;
      flex: 1;
    }
    
    .resource-link {
      color: #0071e3;
      font-weight: 500;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .resource-link svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
    }
    .resource-card:hover .resource-link svg {
      transform: translateX(4px);
    }
  </style>
</head>
<body>
  <!-- Include header via JS or template, simulating for now -->
  <header class="site-header" id="site-header">
    <div class="nav-inner local-inner">
      <a class="brand" href="/"><img src="/images/club-lockup.webp" alt="Apple Developer Club SGU" class="brand-logo" width="180" height="60" /></a>
      <nav id="navigation">
        <a href="/">The Club</a>
        <a href="/events/">Events</a>
        <a href="/guide/">Club Guide</a>
        <a href="/resources/" aria-current="page">Resources</a>
        <a href="/team/">Team</a>
        <a class="button small" href="/join/">Sign In</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <header class="page-header">
      <h1 class="page-title">Resources</h1>
      <p class="page-desc">Everything you need to build incredible apps for Apple platforms.</p>
    </header>

    <div class="resources-sections" id="resources-container">
      <!-- Generated via JS -->
    </div>
  </main>

  <script type="module" src="/src/public-data.js"></script>
</body>
</html>
